<title>πCred Audit Registry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a registry ledger. Header strip, filter bar, then a two-pane split: audited contracts on the left, the
   selected audit's verification checklist and report on the right. Stacks to one column on phones. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #e9edf2; --fg: #16202b; --muted: #5d6c7b; --line: #d6dde5;
  --accent: #1d5bb8; --accent-fg: #ffffff;
  --good: #167a43; --good-bg: #e2f4e9; --warn: #9a5b00; --warn-bg: #fbefd8; --bad: #b02a22; --bad-bg: #fbe3e1;
  --info: #3b4f66; --info-bg: #e6ebf2;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --surface: #171f28; --surface-2: #1f2a35; --fg: #e4e9ef; --muted: #90a0b1; --line: #2a3542;
  --accent: #6ea4ff; --accent-fg: #0b1320;
  --good: #4fd58d; --good-bg: #16302a; --warn: #f1b45f; --warn-bg: #3a2b14; --bad: #ff7b72; --bad-bg: #3d1f1d;
  --info: #b5c3d3; --info-bg: #25303d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #171f28; --surface-2: #1f2a35; --fg: #e4e9ef; --muted: #90a0b1; --line: #2a3542;
  --accent: #6ea4ff; --accent-fg: #0b1320;
  --good: #4fd58d; --good-bg: #16302a; --warn: #f1b45f; --warn-bg: #3a2b14; --bad: #ff7b72; --bad-bg: #3d1f1d;
  --info: #b5c3d3; --info-bg: #25303d; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); margin: 0 }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 16px 40px; padding-inline: 16px }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 22px; font-weight: 700 } h2 { font-size: 17px; font-weight: 700 } h3 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted) }
a { color: var(--accent) }
button { font: inherit; cursor: pointer }
code, .mono { font-family: var(--font-mono); font-size: 12.5px }
.muted { color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--info-bg); color: var(--info); white-space: nowrap }
.pill.good { background: var(--good-bg); color: var(--good) } .pill.warn { background: var(--warn-bg); color: var(--warn) } .pill.bad { background: var(--bad-bg); color: var(--bad) }
.pill.accent { background: var(--accent); color: var(--accent-fg) }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line) }
header.top .grow { flex: 1 1 240px; min-width: 0 }
header.top .sub { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 13px }
header.top .sub a.mono { color: var(--accent); text-decoration: none } header.top .sub a.mono:hover { text-decoration: underline }

details.settings { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
details.settings summary { cursor: pointer; padding: 8px 12px; font-weight: 600; color: var(--muted); list-style: none }
details.settings summary::before { content: "▸ "; } details.settings[open] summary::before { content: "▾ "; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 0 12px 12px }
.settings-grid label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0 }
.settings-grid input, .settings-grid textarea { font: 13px var(--font-mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; min-width: 0 }
.settings-grid textarea { min-height: 54px; resize: vertical }
.settings-actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 7px; padding: 6px 12px; font-weight: 600 }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; font: 14px var(--font-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg) }
.grades { display: flex; gap: 6px }
.gbtn { width: 34px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 700 }
.gbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--surface-2) }
.status { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 10px }

.split { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start }
@media (max-width: 860px) { .split { grid-template-columns: 1fr } }
.list { display: grid; gap: 8px; min-width: 0 }
.card { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; color: inherit; width: 100%; min-width: 0 }
.card:hover { border-color: var(--accent) } .card[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.grade { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 10px; font: 700 26px/1 var(--font-body) }
.grade small { font: 600 11px/1 var(--font-mono); margin-top: 3px; opacity: .85 }
.g-A { background: var(--good-bg); color: var(--good) } .g-B { background: var(--good-bg); color: var(--good); filter: saturate(.6) }
.g-C { background: var(--warn-bg); color: var(--warn) } .g-D { background: var(--bad-bg); color: var(--bad); filter: saturate(.7) } .g-F { background: var(--bad-bg); color: var(--bad) }
.card .name { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0 }
.card .addr { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); align-items: center }
.sev { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 5px; font: 600 11px/18px var(--font-mono); text-align: center }
.sev-critical, .sev-high { background: var(--bad-bg); color: var(--bad) } .sev-medium { background: var(--warn-bg); color: var(--warn) }
.sev-low, .sev-informational { background: var(--info-bg); color: var(--info) }

.detail { display: grid; gap: 14px; min-width: 0 }
.panel { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px; min-width: 0 }
.panel > h3 { margin-bottom: 10px }
.dhead { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap }
.dhead .grade { width: 64px; height: 64px; font-size: 32px }
.dhead .grow { flex: 1 1 260px; min-width: 0 }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13.5px; min-width: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.checks { display: grid; gap: 6px }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 14px }
.check .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font-mono) }
.ic.ok { background: var(--good-bg); color: var(--good) } .ic.fail { background: var(--bad-bg); color: var(--bad) } .ic.pend { background: var(--info-bg); color: var(--info) } .ic.warn { background: var(--warn-bg); color: var(--warn) }
.check .why { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere }
p.summary { margin: 0; font-size: 15px; line-height: 1.55 }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; border-top: 0 }
td.n { font-variant-numeric: tabular-nums }
.scroll { overflow-x: auto; min-width: 0 }
.versions { display: flex; flex-wrap: wrap; gap: 6px }
.vbtn { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 7px; padding: 4px 9px; font-size: 12.5px }
.vbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent) }
.hash { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere }
.hash a { color: var(--accent); text-decoration: none } .hash a:hover { text-decoration: underline }
details.more summary { cursor: pointer; color: var(--accent); font-size: 13.5px }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px }
@media (prefers-reduced-motion: no-preference) { .card, .btn, .vbtn { transition: border-color .12s } }
</style>

<div class="wrap">
  <header class="top">
    <div class="grow">
      <h1>πCred Audit Registry</h1>
      <div class="sub">
        <span id="chainName">Sepolia</span>
        <a class="mono" id="registryLink" href="https://sepolia.etherscan.io/address/0x7A165e86e707Ff7E69D687Af3350242BDEc5C4cC" target="_blank" rel="noopener">0x7A165e86e707Ff7E69D687Af3350242BDEc5C4cC</a>
      </div>
    </div>
  </header>

  <details class="settings" id="settings">
    <summary>Connection</summary>
    <div class="settings-grid">
      <label>Registry RPC URL <input id="cfgRpc" placeholder="https://..."></label>
      <label>Registry address <input id="cfgRegistry" placeholder="0x..."></label>
      <label>First block to scan <input id="cfgFrom" inputmode="numeric" placeholder="11829777"></label>
      <label>RPC per audited chain (JSON) <textarea id="cfgRpcs" placeholder='{"1": "https://ethereum-rpc.publicnode.com"}'></textarea></label>
      <div class="settings-actions">
        <button class="btn primary" id="reload" type="button">Reload from chain</button>
        <button class="btn" id="resetCfg" type="button">Reset to defaults</button>
        <span class="muted" style="font-size:12.5px">Reads only. Nothing here is sent anywhere but the RPC you name.</span>
      </div>
    </div>
  </details>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search by address or contract name" aria-label="Search audits">
    <div class="grades" role="group" aria-label="Filter by grade">
      <button class="gbtn" data-g="A" aria-pressed="false" type="button">A</button><button class="gbtn" data-g="B" aria-pressed="false" type="button">B</button><button class="gbtn" data-g="C" aria-pressed="false" type="button">C</button><button class="gbtn" data-g="D" aria-pressed="false" type="button">D</button><button class="gbtn" data-g="F" aria-pressed="false" type="button">F</button>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>

  <div class="split">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="empty">Select an audited contract to see its verification checklist and report.</div></div>
  </div>
</div>

ly() returns the contract's raw ETH balance. ETH force-sent via selfdestruct (or block rewards) increases totalSupply above the sum of balanceOf entries. Every WETH balance remains fully backed, so this is accounting noise only.","location":"WETH9.sol:WETH9.totalSupply","recommendation":"Integrators should not rely on totalSupply equalling the sum of balances.","severity":"informational","title":"totalSupply derived from this.balance"},{"description":"Compiled with Solidity 0.4.19 and uses unchecked += / -=. Subtractions are guarded by explicit require checks and additions are bounded by total ETH supply, so no exploitable overflow exists, but the code lacks modern safety features (e.g. event `emit` keyword, explicit visibility defaults).","location":"WETH9.sol:WETH9.deposit / transferFrom","recommendation":"None required for this deployment; new deployments should use a modern compiler.","severity":"informational","title":"Legacy compiler without checked arithmetic"}],"grade":"A","scope":{"analyzed":["0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14"],"skipped":[],"sourceVerified":{"0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14":true}},"score":95,"summary":"The contract is the canonical Dapphub WETH9 wrapped-ether token (Sepolia deployment). Users deposit ETH via deposit() or the payable fallback to mint 1:1 WETH balances, and burn via withdraw() to receive ETH back. It exposes a minimal ERC20 surface (transfer, transferFrom with infinite-allowance shortcut, approve) with totalSupply reported as the contract's ETH balance. There is no owner, no admin functions, no upgradeability and no external dependencies.","upgradeability":{"notes":"Plain, non-proxied contract with no owner or privileged roles. Behavior is immutable.","timelock":false,"upgradeable":false}},"dependencies":[],"id":"eip155:11155111:0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14","notFetched":[],"pipeline":{"auditorVersion":"0.1.0","configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3" ,{"description":"All forwarded calls originate from the Multicall3 address with no caller authentication. Any ERC20 approval, ERC721 operator status or other permission granted to this contract can be exercised by any user via aggregate*. This is inherent to the design (stateless batching) but is a common integrator footgun.","location":"Multicall3.aggregate3 / aggregate3Value","recommendation":"Never grant token approvals or privileged roles to the Multicall3 address; use it only for read batching or for calls whose authorization does not depend on msg.sender.","severity":"low","title":"Contract acts as msg.sender for all forwarded calls; approvals/allowances granted to it are drainable by anyone"},{"description":"tryBlockAndAggregate returns blockhash(block.number), which is always bytes32(0) in the EVM since the current block's hash is not available. Kept for Multicall2 ABI compatibility.","location":"Multicall3.tryBlockAndAggregate","recommendation":"Consumers should not rely on the blockHash return value; use getLastBlockHash for a meaningful value.","severity":"informational","title":"blockhash(block.number) always returns zero"},{"description":"aggregate3 reverts with revert(0x00, 0x64) while aggregate3Value uses revert(0x00, 0x84), returning 32 extra bytes of memory beyond the encoded Error(string). Harmless but inconsistent; the assembly also clobbers memory 0x00-0x64 (free memory pointer) which is fine only because it reverts immediately.","location":"Multicall3.aggregate3Value (assembly block)","recommendation":"Use 0x64 for consistency; no security impact.","severity":"informational","title":"Inconsistent revert data length in aggregate3Value assembly"}],"grade":"A","scope":{"analyzed":["0xcA11bde05977b3631167028862bE2a173976CA11"],"skipped":[],"sourceVerified":{"0xcA11bde05977b3631167028862bE2a173976CA11":true}},"score":95,"summary":"Multicall3 is the canonical, stateless call-aggregation helper deployed at its well-known deterministic address (0xcA11.. ,"url":"https://sourcify.dev/server/v2/contract/11155111/0xcA11bde05977b3631167028862bE2a173976CA11?fields=all"}},"toolCalls":[{"args":{"address":"0xcA11bde05977b3631167028862bE2a173976CA11","calldata":"0x4d2301cc000000000000000000000000ca11bde05977b3631167028862be2a173976ca11"},"name":"eth_call","resultSha256":"2abba11b2d466af965ea0167545f40109bc70e524964c8a62ef1449e8f0dc092"}]},"scaeCheck":{"disagreement":false,"gradeIntact":"A","gradeStripped":"A"},"subject":{"address":"0xcA11bde05977b3631167028862bE2a173976CA11","blockNumber":11830296,"chainId":11155111,"codeHash":"0xd5c15df687b16f2ff992fc8d767b4216323184a2bbc6ee2f9c398c318e770891","matchType":"exact_match","name":"Multicall3","proxy":null,"role":"primary","sourceVerified":true}},"blockNumber":11830316,"txHash":"9505f0ce511a51f1ae97732c83da00c2a2cfa518d8facc28deba7d0bbd91c30e"},{"key":"0x65fd99dadd419f3d057c91d4961e3d95e06d84c05705d82ad0a6cdc22a50bf1c","signer":"0x8De4Bb6Ff68DB026e94131e36688C50dF78246Be","record":{"chainId":11155111,"contractAddress":"0x000000000022D473030F116dDEE9F6B43aC78BA3","codeHash":"0x96d9f5c3f0fb0423426b7f970186235b7347027f4e5c19c40c412b7d97fc3751","blockNumber":11830302,"dependenciesHash":"0x569e75fc77c1a856f6daaf9e69d8a9566ca34aa47f9133711ce065a571af0cfd","grade":"A","score":93,"configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","reportHash":"0x0f7ece7fd0574ca41d9acd578559228edc1933d8208f903683f4cc16f24b5640","issuedAt":1790960197},"report":{"audit":{"confidence":{"level":"high","reason":"Full verified source (sourcify match) for the primary contract and its vendored solmate dependencies was provided; the code matches the well-known canonical Uniswap Permit2 implementation and no external trusted contracts are involved."},"findings":[{"description":"SafeTransferLib.safeTransferFrom treats a call with empty returndata as success and never checks that `token` has code. A permitTransferFrom/transferFrom for a token address with no deployed code therefore 'succeeds' and consumes the owner's nonce/allowance without moving any tokens. Integrators that credit value solely because the Permit2 call did not revert can be misled (e.g. counterfactual or destroyed token addresses).","location":"solmate/src/utils/SafeTransferLib.sol:safeTransferFrom (called from SignatureTransfer._permitTransferFrom and AllowanceTransfer._transfer)","recommendation":"Integrators should verify token code existence or check balance deltas; at the library level an `extcodesize` check before the call would close the gap.","severity":"low","title":"ERC20 transferFrom to codeless token address succeeds silently"},{"description":"SignatureVerification.verify uses raw ecrecover without restricting `s` to the lower half-order and accepts both 65-byte and 64-byte (EIP-2098) encodings, so several distinct byte strings validate for the same message. Replay is prevented by nonce consumption, so impact is limited to off-chain systems that index or deduplicate by signature bytes.","location":"src/libraries/SignatureVerification.sol:verify","recommendation":"Document that signature bytes are not unique; off-chain systems should key on (owner, nonce) or the typed-data hash rather than signature bytes.","severity":"low","title":"ECDSA path accepts malleable signatures (no low-s enforcement, two encodings)"},{"description":"verify() routes any claimedSigner with non-zero code to IERC1271.isValidSignature. Post-Pectra (active on Sepolia at this block), an EOA with a 7702 delegation has code, so its plain ECDSA signatures are rejected unless the delegate contract exposes a compliant isValidSignature. Conversely a counterfactual address that gains code later changes verification semantics for outstanding signatures.","location":"src/libraries/SignatureVerification.sol:verify","recommendation":"No change required for the immutable deployment; wallets/integrators should ensure 7702 delegates implement ERC-1271 or fall back to ECDSA for self-signatures.","severity":"low","title":"Signer type decided by code.length; EIP-7702-delegated EOAs must implement ERC-1271"},{"description":"permitWitnessTransferFrom builds the EIP-712 type hash by concatenating a fixed stub with an arbitrary caller string. A malformed string (missing closing parenthesis, missing TokenPermissions definition, wrong ordering) yields a type hash wallets will not reproduce, causing signature failures rather than a security breach, but it places correctness burden on integrators.","location":"src/libraries/PermitHash.sol:hashWithWitness","recommendation":"Integrators must construct witnessTypeString exactly per EIP-712 nested-struct ordering; consider off-chain test vectors against the contract hash.","severity":"informational","title":"Caller-supplied witnessTypeString is not validated"},{"description":"_transfer reverts only when block.timestamp > expiration, so an allowance remains spendable in the block whose timestamp equals expiration. approve/permit with expiration 0 store block.timestamp, making the allowance valid only within the current block. Both are documented behaviours but can surprise users.","location":"src/AllowanceTransfer.sol:_transfer; src/libraries/Allowance.sol:updateAll/updateAmountAndExpiration","recommendation":"None required; front-ends should surface these semantics clearly.","severity":"informational","title":"Allowance usable at exactly the expiration timestamp; expiration 0 means current block only"},{"description":"Permit2 allowances are only meaningful if the owner has also approved Permit2 on the ERC20 itself; stored Permit2 allowances are decremented before the external transferFrom, which may still revert. Fee-on-transfer or rebasing tokens are forwarded as-is with no amount reconciliation.","location":"src/AllowanceTransfer.sol:_transfer","recommendation":"Integrators handling non-standard tokens should measure recipient balance deltas.","severity":"informational","title":"Allowance-based transfers do not re-validate the token's standard ERC20 approval"}],"grade":"A","scope":{"analyzed":["0x000000000022D473030F116dDEE9F6B43aC78BA3"],"skipped":[],"sourceVerified":{"0x000000000022D473030F116dDEE9F6B43aC78BA3":true}},"score":93,"summary":"Permit2 is Uniswap's canonical, permissionless token-approval router deployed at the same CREATE2 address across chains. It combines SignatureTransfer (one-off EIP-712 signed transfers with unordered bitmap nonces, optional witness data) and AllowanceTransfer (signed or direct time-bound, amount-capped allowances with ordered per-(owner,token,spender) nonces). Users approve Permit2 on the ERC20, after which spenders pull tokens via signatures or stored allowances; there is no owner, admin, pause, or upgrade path. Live DOMAIN_SEPARATOR responds and the EIP-1967 implementation slot is empty, confirming a plain non-proxy deployment.","upgradeability":{"notes":"Plain contract with no proxy, no owner and no privileged functions; EIP-1967 implementation slot is zero. All state is user-scoped (own allowances and nonces).","timelock":false,"upgradeable":false}},"dependencies":[],"id":"eip155:11155111:0x000000000022D473030F116dDEE9F6B43aC78BA3","notFetched":[],"pipeline":{"auditorVersion":"0.1.0","configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","model":"claude-fable-5-1","requests":[{"model":"claude-fable-5-1","pass":"intact","requestSha256":"73f404944faa8ae028b5566427c0e562a676caad7b3840d61f91ec9b406b45c9","responseSha256":"16728317b1fadf6ec98c725d727ef6591f00b7a6d9f8a579d35610dc1c483610","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":44749,"output":1890}},{"model":"claude-fable-5-1","pass":"intact","requestSha256":"e3259f7bd20fcb3809fd9492e09bb846a9fc4c61d35bd52fa836f5d277f9f734","responseSha256":"836beceb7f6cfa7623ceaf02a971b9a59918ba51783130789685ced334a93de3","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":46768,"output":1917}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"05011324f 026e94131e36688C50dF78246Be","record":{"chainId":1,"contractAddress":"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","codeHash":"0x6a5d24750f78441e56fec050dc52fe8e911976485b7472faac7464a176a67caa","blockNumber":26105959,"dependenciesHash":"0x569e75fc77c1a856f6daaf9e69d8a9566ca34aa47f9133711ce065a571af0cfd","grade":"F","score":10,"configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","reportHash":"0x6d0e6cedb9b6ef79ea84102d2afb98e56a0f1c4306a5ebf0fb9b40c8e6b38999","issuedAt":1790960167},"report":{"audit":{"confidence":{"level":"high","reason":"Full verified source of the primary contract was available and the reentrancy vulnerabilities are unambiguous and historically confirmed (June 2016 exploit). Dependency ManagedAccount sub-contracts are compiled from the same source file; live state calls confirmed curator and rewardAccount addresses."},"findings":[{"description":"splitDAO first sends the caller's proportional ETH to the child DAO via newDAO.createTokenProxy.value(fundsToBeMoved)(msg.sender) and then calls withdrawRewardFor(msg.sender), which performs rewardAccount.payOut(_account, reward) -> _recipient.call.value(_amount)() with all remaining gas. Only after these external calls are balances[msg.sender], totalSupply and paidOut[msg.sender] updated. A malicious msg.sender (contract) can recursively re-enter splitDAO from its fallback while its balance is still non-zero, repeatedly moving fundsToBeMoved out of the DAO. This is the exact vector used in the June 2016 exploit that drained roughly a third of the DAO's ETH.","location":"DAO.splitDAO / DAO.withdrawRewardFor / ManagedAccount.payOut","recommendation":"Apply checks-effects-interactions: zero balances[msg.sender], paidOut and decrement totalSupply before any external call; add a reentrancy guard; use send/transfer-style gas-limited value transfers for rewards instead of call.value with unlimited gas.","severity":"critical","title":"Reentrancy in splitDAO: ETH and rewards moved before token balance is zeroed"},{"description":"refund() sends weiGiven[msg.sender] via msg.sender.call.value(...)() and only afterward zeroes balances, weiGiven and totalSupply. During an unfueled (failed) creation, a contract caller can re-enter refund() in its fallback and withdraw weiGiven repeatedly until the DAO/extraBalance funds are exhausted.","location":"TokenCreation.refund","recommendation":"Zero weiGiven/balances and update totalSupply before the external send, and use a gas-limited transfer or a reentrancy guard.","severity":"critical","title":"Reentrancy in TokenCreation.refund: state updated after external call"},{"description":"withdrawRewardFor (reached via getMyReward, transferWithoutReward, transferFromWithoutReward) calls rewardAccount.payOut(_account, reward) \u2014 an unlimited-gas call.value \u2014 before incrementing paidOut[_account]. A contract recipient can re-enter getMyReward and drain the rewardAccount beyond its entitlement.","location":"DAO.withdrawRewardFor","recommendation":"Increment paidOut before calling payOut, or guard against reentrancy.","severity":"high","title":"Reward withdrawal reentrancy allows repeated payouts"},{"description":"Because splitDAO reads balances[msg.sender] for fundsToBeMoved and only burns at the end, an attacker in the reentrant window can also call transfer() to move DAO tokens to a second address before the burn, keeping the tokens while having extracted the proportional ETH. transfer is permitted because isBlocked is cleared once now > votingDeadline, which is exactly the splitDAO window.","location":"DAO.splitDAO, DAO.transfer","recommendation":"Burn tokens before external calls; block transfers for accounts with in-flight splits.","severity":"high","title":"Token transfer during reentrant split lets attacker preserve balance (reward/split double-dipping)"},{"description":"executeProposal performs p.recipient.call.value(p.amount)(_transactionData) before setting p.proposalPassed and closing the proposal. Although p.open remains true during the call, re-entering executeProposal for the same ID would re-execute the recipient call and re-send p.amount (the deposit send also repeats since the quorum branch runs again). A whitelisted recipient contract could therefore drain more than the approved amount. Mitigated only by the curator whitelist.","location":"DAO.executeProposal","recommendation":"Set p.open = false / closeProposal before the external call and add a reentrancy guard.","severity":"high","title":"Reentrancy guard absent in executeProposal; recipient call with arbitrary data and unlimited gas"},{"description":"In createTokenProxy, extraBalance.call.value(msg.value - token)() return value is ignored; if it fails, ETH remains in the DAO but accumulatedInput is not updated, breaking refund accounting (refund() compares extraBalance.balance to accumulatedInput). Also the fallback function returns createTokenProxy results and throws on failure path only in some branches.","location":"TokenCreation.createTokenProxy","recommendation":"Check the return value of the extraBalance transfer and throw on failure.","severity":"medium","title":"Proposal recipient call is executed even if the call fails silently and extraBalance.call return value is ignored"},{"description":"The curator can unilaterally whitelist/unwhitelist recipients (changeAllowedRecipients), is whitelisted by default so proposals can send all DAO ETH to the curator, and can call halveMinQuorum every 2 weeks to progressively lower quorum requirements to near zero, making governance capture easier. The curator is an EOA/contract at 0xDa4a4626d3E16e094De3225A751aAb7128e96526 with no timelock.","location":"DAO.changeAllowedRecipients, DAO.halveMinQuorum, DAO constructor","recommendation":"Gate curator actions behind token-holder approval or a timelock; do not auto-whitelist the curator.","severity":"medium","title":"Curator has strong centralized powers"},{"description":"All additions/subtractions on balances, totalSupply, yea/nay, paidOut and rewardToken are unchecked. Combined with the reentrancy flaws, totalSupply -= balances[msg.sender] in splitDAO can underflow after repeated re-entries, corrupting quorum and reward math. Division by zero is possible in retrieveDAOReward (totalRewardToken == 0), transferPaidOut (balanceOf(_from)==0) and splitDAO (rewardToken[address(this)]==0), causing throws (DoS) rather than loss.","location":"DAO.splitDAO, DAO.retrieveDAOReward, DAO.transferPaidOut, DAO.minQuorum","recommendation":"Use checked arithmetic and guard divisors.","severity":"medium","title":"Unchecked arithmetic throughout (Solidity 0.3.1, no SafeMath)"},{"description":"Voters are blocked from transferring tokens until the latest proposal they voted on closes (up to 8 weeks + execution period); minQuorum can be lowered via halveMinQuorum while token holders are blocked; and a majority holder in a child DAO (created with closingTime = now + 27 days and curator = _newCurator) can follow splitting minorities. These are known governance-design weaknesses of this contract.","location":"DAO.vote, DAO.isBlocked, DAO.createNewDAO","recommendation":"Decouple vote locking from transfer, and allow deadline-based unblocking without requiring the voter to call unblockMe.","severity":"medium","title":"Vote-blocking and quorum design enable stalking / griefing attacks"},{"description":"DAO.transfer/transferFrom throw on failure rather than returning false, and approve has the standard allowance front-running race. transfer to address(0) is not prevented.","location":"DAO.transfer, DAO.transferFrom, Token.approve","recommendation":"Follow ERC-20 return semantics consistently and consider increase/decreaseAllowance.","severity":"low","title":"ERC-20 non-standard behaviour: transfer/transferFrom throw instead of returning false; approve race"},{"description":"Compiled with solc 0.3.1 (throw, constant, implicit visibility, sha3, `_` modifier syntax). The contract has been superseded by the 2016 hard fork; remaining state is effectively historical. The closing time has long passed; new proposals require isFueled and now > closingTime, so governance functions remain callable in principle.","location":"DAO.sol (whole file)","recommendation":"Treat the contract as deprecated; do not deposit funds.","severity":"informational","title":"Obsolete compiler and language constructs"}],"grade":"F","scope":{"analyzed":["0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413"],"skipped":[],"sourceVerified":{"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413":true}},"score":10,"summary":"This is \"The DAO\" (Solidity 0.3.1), a token-sale-funded governance vault: contributors send ETH to mint DAO tokens, token holders create and vote on proposals to send ETH to curator-whitelisted recipients, dissenting holders can split into a child DAO via splitDAO, and rewards flow back through ManagedAccount sub-contracts (rewardAccount, DAOrewardAccount, extraBalance). Live state confirms curator = 0xDa4a4626d3E16e094De3225A751aAb7128e96526 and rewardAccount = 0xd2e16A20dd7B1ae54fB0312209784478D069c7B0, with ~9.86M tokens still in totalSupply. The code contains the well-known unguarded reentrancy in splitDAO/withdrawRewardFor that was exploited in June 2016 to drain ~3.6M ETH, plus several further reentrancy and accounting flaws.","upgradeability":{"notes":"No proxy pattern. However, newContract() allows a passed proposal (53% quorum check) to move all ETH and reward tokens to a curator-whitelisted new contract, which functions as a governance-driven migration without a timelock beyond the proposal debate period.","timelock":false,"upgradeable":false}},"dependencies":[],"id":"eip155:1:0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","notFetched":[],"pipeline":{"auditorVersion":"0.1.0","configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","model":"claude-fable-5-1","requests":[{"model":"claude-fable-5-1","pass":"intact","requestSha256":"7d987c10194c7d5d52f4ef8b97d791b "args":{"address":"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","calldata":"0x0e708203"},"name":"eth_call","resultSha256":"69f7cfaa9a421c6790f989bf778c841aa80c1b79761e17316dbf22687ef2ffc7"},{"args":{"address":"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","calldata":"0xe66b792d"},"name":"eth_call","resultSha256":"4eaddc8cfcdd27223821e3e31ab54b2416dd3b0c1a86afd7e8d6538ca1bd0a77"},{"args":{"address":"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","calldata":"0x18160ddd"},"name":"eth_call","resultSha256":"bb6e6321d4789475778db5a37dea8661239fd8ee2e2aac39b4a33ba955615356"},{"args":{"address":"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","calldata":"0x0e708203"},"name":"eth_call","resultSha256":"69f7cfaa9a421c6790f989bf778c841aa80c1b79761e17316dbf22687ef2ffc7"}]},"scaeCheck":{"disagreement":false,"gradeIntact":"F","gradeStripped":"F"},"subject":{"address":"0xBB9bc244D798123fDe783fCc1C72d3Bb8C189413","blockNumber":26105959,"chainId":1,"codeHash":"0x6a5d24750f78441e56fec050dc52fe8e911976485b7472faac7464a176a67caa","matchType":"etherscan","name":"DAO","proxy":null,"role":"primary","sourceVerified":true}},"blockNumber":11830319,"txHash":"ba26474a7c1a1e89fa7dc9cee2eb541d52c6524370cdbad6e7598ab3dd1b78f0"},{"key":"0x078279308a7441fdb87d03a085bf79e2d2446e6a5203c24235f83621ae584e8b","signer":"0x8De4Bb6Ff68DB026e94131e36688C50dF78246Be","record":{"chainId":1,"contractAddress":"0xC5d105E63711398aF9bbff092d4B6769C82F793D","codeHash":"0x8c26af50a81b37dbe971be5b898593fea44d3af9b7018848e6b6bed38db2923c","blockNumber":26105971,"dependenciesHash":"0x569e75fc77c1a856f6daaf9e69d8a9566ca34aa47f9133711ce065a571af0cfd","grade":"F","score":5,"configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","reportHash":"0xa7a7772c1447670b84010db3086cf0cbbc0c82d79c2e694ad79962808fd05755","issuedAt":1790960225},"report":{"audit":{"confidence":{"level":"high","reason":"Full verified source was provided and is small and self-contained with no external dependencies; the overflow bug is a well-documented, historically exploited vulnerability, and the live paused/owner state was confirmed via eth_call."},"findings":[{"description":"`uint256 amount = uint256(cnt) * _value;` is computed with raw multiplication instead of SafeMath.mul. With cnt = 2 and _value = 2**255, amount wraps to 0, so the balance check `balances[msg.sender] >= amount` passes and `sub(0)` succeeds, while each receiver is credited 2**255 tokens. This bug was exploited on-chain (CVE-2018-10299), creating tokens far in excess of totalSupply. The only thing preventing re-exploitation today is the owner-set paused flag; if the owner ever unpauses, the attack is immediately available to anyone.","location":"BecToken.sol:PausableToken.batchTransfer","recommendation":"Use `_value.mul(cnt)` (SafeMath) for the amount calculation, or redeploy a corrected token. The current deployment cannot be fixed and should remain permanently paused / be considered deprecated.","severity":"critical","title":"Integer overflow in batchTransfer allows unlimited token minting"},{"description":"Live state shows paused == true (owner 0x9c8d0efef2812041cef15e1c6f874f0db1f96ac6). transfer, transferFrom, approve and batchTransfer all carry whenNotPaused, so every holder's tokens are currently non-transferable at the sole discretion of the owner, with no timelock or expiry. Although the pause is a mitigation for the critical bug, it also means user funds are frozen indefinitely.","location":"BecToken.sol:Pausable.pause / PausableToken","recommendation":"Users should treat balances as frozen. A redeployment with a fixed batchTransfer and a snapshot-based migration is the only path to restoring usability.","severity":"high","title":"Contract is paused: all token transfers and approvals are frozen by owner"},{"description":"Ownable/Pausable give one EOA-or-contract owner the unilateral ability to halt or resume all token activity, and transferOwnership is single-step. Combined with the batchTransfer bug, an unpause by a compromised or malicious owner would re-enable the exploit.","location":"BecToken.sol:Ownable, Pausable","recommendation":"Place ownership behind a multisig/timelock and use two-step ownership transfer.","severity":"medium","title":"Single-key owner can pause/unpause without timelock"},{"description":"approve sets allowance directly; a spender can front-run an allowance change to spend both the old and new allowance. No increase/decrease helpers are provided.","location":"BecToken.sol:StandardToken.approve","recommendation":"Add increaseApproval/decreaseApproval or require setting allowance to 0 first.","severity":"low","title":"approve race condition (no increaseApproval/decreaseApproval)"},{"description":"After the overflow exploit, the sum of balances vastly exceeds the stored totalSupply (7e27). totalSupply() is therefore inaccurate for any integrator relying on it.","location":"BecToken.sol:BecToken.BecToken / ERC20Basic.totalSupply","recommendation":"None possible in this deployment; integrators should not rely on totalSupply().","severity":"low","title":"totalSupply not updated and no longer reflects circulating balances"},{"description":"Compiled with 0.4.19: no built-in overflow checks, constructor-by-name, `constant` instead of `view`, assert-based SafeMath consuming all gas on failure, and public functions without explicit visibility on constructors/fallback.","location":"BecToken.sol (pragma ^0.4.16)","recommendation":"Any redeployment should target a modern compiler (>=0.8) with checked arithmetic and OpenZeppelin ERC20.","severity":"informational","title":"Outdated compiler and legacy patterns"}],"grade":"F","scope":{"analyzed":["0xC5d105E63711398aF9bbff092d4B6769C82F793D"],"skipped":[],"sourceVerified":{"0xC5d105E63711398aF9bbff092d4B6769C82F793D":true}},"score":5,"summary":"BecToken (BEC) is a Solidity 0.4.x ERC20 token with owner-controlled pause functionality and a batchTransfer helper that sends a fixed amount to up to 20 receivers. Total supply of 7 billion tokens was minted to the deployer at construction. The contract is not upgradeable, but it contains the well-known batchTransfer integer-overflow bug (CVE-2018-10299) that was exploited on mainnet in April 2018 to mint effectively unlimited tokens; the contract is currently paused (paused == true), which blocks all transfers, transferFrom, approve and batchTransfer calls.","upgradeability":{"notes":"Plain non-proxy deployment; no upgrade mechanism. Owner (0x9c8d0efef2812041cef15e1c6f874f0db1f96ac6) can only pause/unpause and transfer ownership; contract is currently paused.","timelock":false,"upgradeable":false}},"dependencies":[],"id":"eip155:1:0xC5d105E63711398aF9bbff092d4B6769C82F793D","notFetched":[],"pipeline":{"auditorVersion":"0.1.0","configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","model":"claude-fable-5-1","requests":[{"model":"claude-fable-5-1","pass":"intact","requestSha256":"0f06992b978f97b4c9c5e26114a8d345fe0dd1dbae5c7a827d0d188ee00732ee","responseSha256":"7d43c02c2b269acaac1466a7f3515f74b126ed0aaca6f194a35a9a02208b927c","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":3808,"output":361}},{"model":"claude-fable-5-1","pass":"intact","requestSha256":"045d8105b758e538383690dcbd368e610c4d7eb5a79491c19264de94fefe36e1","responseSha256":"bd65a204f668d0dd5ec2989dd92c171598f17bebb5f7378206cd6ca03d7572bb","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":4289,"output":1711}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"0cfc9de29251087a769871d5612a785a8dee230cef9d5d6993d4fb10855af8ab","responseSha256":"ca6bd81fb63acc7ad5253283574e8ad84ba48a80c7228fb24628bfa45e6fbc54","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":2333,"output":451}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"25b8178d179f1c8573e025a60b7805b07dff85257b3c86cc96d92fee53da6c74","responseSha256":"0b525fc00e7c68e5ce12e15ad705453ea428ce02a9e71a5692ba1efdba10f57c","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":2904,"output":1463}}]},"provenance":{"rpc":{"blockHash":"0x7339e12f23b3c574d0dac83ef41f63c54b39de8c1e93d89fcc349beeb7cdc13b","blockNumber":26105971,"url":"https://ethereum-rpc.publicnode.com"},"sources":{"0xC5d105E63711398aF9bbff092d4B6769C82F793D":{"bodySha256":"e13c406b968cb788ca6fe3b5f87501cd080d4cd607387fdd17e698dfe519b5ed","matchType":"match","provider":"sourcify","url":"https://sourcify.dev/server/v2/contract/1/0xC5d105E63711398aF9bbff092d4B6769C82F793D?fields=all"}},"toolCalls":[{"args":{"address":"0xC5d105E63711398aF9bbff092d4B6769C82F793D","calldata":"0x5c975abb"},"name":"eth_call","resultSha256":"4eaddc8cfcdd27223821e3e31ab54b2416dd3b0c1a86afd7e8d6538ca1bd0a77"},{"args":{"address":"0xC5d105E63711398aF9bbff092d4B6769C82F793D","calldata":"0x8da5cb5b"},"name":"eth_call","resultSha256":"8884c5a5007c4df72dd90f2520e947921507cfc53222488c1f733e14b3a6a172"},{"args":{"address":"0xC5d105E63711398aF9bbff092d4B6769C82F793D","calldata":"0x5c975abb"},"name":"eth_call","resultSha256":"4eaddc8cfcdd27223821e3e31ab54b2416dd3b0c1a86afd7e8d6538ca1bd0a77"},{"args":{"address":"0xC5d105E63711398aF9bbff092d4B6769C82F793D","calldata":"0x8da5cb5b"},"name":"eth_call","resultSha256":"8884c5a5007c4df72dd90f2520e947921507cfc53222488c1f733e14b3a6a172"}]},"scaeCheck":{"disagreement":false,"gradeIntact":"F","gradeStripped":"F"},"subject":{"address":"0xC5d105E63711398aF9bbff092d4B6769C82F793D","blockNumber":26105971,"chainId":1,"codeHash":"0x8c26af50a81b37dbe971be5b898593fea44d3af9b7018848e6b6bed38db2923c","matchType":"match","name":"BecToken","proxy":null,"role":"primary","sourceVerified":true}},"blockNumber":11830324,"txHash":"d78cc81f0579f4b40487b1325477503505eac20167a0805c423821071cf393a1"},{"key":"0xda08edbe8fc2bba65d34711631afd0bbb7c1df917adfc0e2dc1f964a7e3ec3a2","signer":"0x8De4Bb6Ff68DB026e94131e36688C50dF78246Be","record":{"chainId":1,"contractAddress":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","codeHash":"0x5d300a40efbe8176b85ea632a0d3da8988e0256d9c3a36e87e40cc8884a9862f","blockNumber":26105976,"dependenciesHash":"0x569e75fc77c1a856f6daaf9e69d8a9566ca34aa47f9133711ce065a571af0cfd","grade":"F","score":5,"configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","reportHash":"0xcb9071b4098ace09941ce27be3357960ebf7c9a37c6bafa994b5c2463a8fbdd5","issuedAt":1790960301},"report":{"audit":{"confidence":{"level":"high","reason":"Source is verified (sourcify match), the contract is small and self-contained with no external dependencies, and the critical constructor-naming flaw is unambiguous from the code and matches the historically documented Rubixi exploit."},"findings":[{"description":"The function intended as the constructor is named DynamicPyramid() while the contract is named Rubixi. It therefore compiles as an ordinary public function with no access control; any caller can invoke it to set creator = msg.sender and then call collectAllFees / collectFeesInEther / collectPercentOfFees, changeMultiplier and changeFeePercentage. This is the historical Rubixi exploit.","location":"Rubixi.DynamicPyramid","recommendation":"Contract is immutable and cannot be fixed; do not send funds. In new code use the constructor keyword and explicit access control.","severity":"critical","title":"Misnamed constructor allows anyone to become owner"},{"description":"addPayout, collectAllFees, collectFeesInEther and collectPercentOfFees call .send() without checking the return value. If a send fails (e.g., recipient contract reverts or gas exhaustion), balance/collectedFees are still decremented and payoutOrder advanced, permanently losing the ether inside the contract with no way to recover it (no withdrawal fallback).","location":"Rubixi.addPayout, Rubixi.collectAllFees, Rubixi.collectFeesInEther, Rubixi.collectPercentOfFees","recommendation":"Check send return values (or use a pull-payment pattern) before mutating accounting state.","severity":"high","title":"Unchecked send() return values with silent state updates"},{"description":"Payouts to earlier participants are entirely funded by later deposits with multipliers of 1.2x-3x; the scheme is mathematically guaranteed to leave later participants unpaid. Deposits under 1 ETH are taken entirely as fees with no participation.","location":"Rubixi.init, Rubixi.addPayout","recommendation":"Do not interact; no technical remediation exists for the economic model.","severity":"high","title":"Ponzi design: funds are paid out only from later deposits"},{"description":"addPayout loops over participants while balance exceeds the next payout, performing an external send each iteration. A sufficiently large balance relative to queued payouts can make deposits run out of gas, reverting new entries.","location":"Rubixi.addPayout","recommendation":"Bound the number of payouts per call or use pull payments.","severity":"medium","title":"Unbounded payout loop may exceed gas limit (DoS)"},{"description":"If _amt > collectedFees, collectAllFees() is called (setting collectedFees to 0) and then the function throws on the zero check, so this path is safe; however, when _amt == collectedFees exactly or less there is no issue, but the pre-0.8 compiler provides no overflow checks and the balance/payout arithmetic throughout relies on unchecked math (e.g., msg.value * pyramidMultiplier).","location":"Rubixi.collectFeesInEther","recommendation":"Use checked arithmetic and explicit bounds.","severity":"medium","title":"collectFeesInEther can underflow collectedFees"},{"description":"The check uses <= participants.length, allowing orderInPyramid == length which indexes past the array (throws on read in this compiler version).","location":"Rubixi.participantDetails","recommendation":"Use < participants.length.","severity":"low","title":"participantDetails off-by-one bounds check"},{"description":"Compiled with Solidity 0.2.1; uses throw, implicit public visibility, old modifier syntax (_ without semicolon) and constant instead of view. No events are emitted.","location":"Rubixi.sol","recommendation":"Not fixable in place; modern deployments should use a current compiler.","severity":"informational","title":"Obsolete compiler and legacy constructs"}],"grade":"F","scope":{"analyzed":["0xe82719202e5965Cf5D9B6673B7503a3b92DE20be"],"skipped":[],"sourceVerified":{"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be":true}},"score":5,"summary":"Rubixi is a Ponzi/pyramid scheme contract: senders of >=1 ETH are appended to a participant queue with a promised payout of 1.2x-3x, funded by later entrants, while a 5-10% fee accrues to a 'creator' who can withdraw it. The contract is written for Solidity 0.2.1 and contains the well-known constructor-naming bug: the intended constructor is named DynamicPyramid() rather than Rubixi(), so it is a public function callable by anyone to seize ownership.","upgradeability":{"notes":"Plain immutable contract with no proxy pattern; however, ownership can be seized by anyone via the public DynamicPyramid() function, giving full control of fee withdrawal and parameters.","timelock":false,"upgradeable":false}},"dependencies":[],"id":"eip155:1:0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","notFetched":[],"pipeline":{"auditorVersion":"0.1.0","configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","model":"claude-fable-5-1","requests":[{"model":"claude-fable-5-1","pass":"intact","requestSha256":"c4be98940b5259fa72023e3a8ba7840de8dce5375baeaba73d1170ee911e9fb1","responseSha256":"58116cf536c46323a128a8e71c08ba963d7f064fc9c236df999637c75bfbbd0e","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":2274,"output":318}},{"model":"claude-fable-5-1","pass":"intact","requestSha256":"f091dd0f1af539054fff4f06ed6ed15c926ecea9c84a4f3ca264229108be5f24","responseSha256":"9eb8884d0dd6d8072243de9d82d9dadf10eee0f9b433ff877874918e82541390","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":2715,"output":1756}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"551eef0f74c069382403b1deb74dbafdca726df68c3085c4c71d7817077f4f41","responseSha256":"14df25f9e871db05f3947d93a0820d9c01fbdf8dab6ed031c41872729225aaa3","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":1839,"output":480}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"e313fa559c6c9adbdeb59c3651e3a2f3ca307a1e231bd774a26c67af34ebc0e8","responseSha256":"6f7260e21d3aa4847e7dd97a82ea3d5f271512c7c0d2c35902c4de3d63508d55","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":2497,"output":1916}}]},"provenance":{"rpc":{"blockHash":"0x29ef8d5efce3b5d2e7fbcfba01be9bf831b596ea93d848bdbeb3650da503fcb0","blockNumber":26105976,"url":"https://ethereum-rpc.publicnode.com"},"sources":{"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be":{"bodySha256":"6a7ab4cf7e626919f748effba26d4616b0f98b524c3d3f0e093b68ad125138c8","matchType":"match","provider":"sourcify","url":"https://sourcify.dev/server/v2/contract/1/0xe82719202e5965Cf5D9B6673B7503a3b92DE20be?fields=all"}},"toolCalls":[{"args":{"address":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","slot":"0x5"},"name":"read_storage","resultSha256":"237f2dab356bba4af2833a18690d0ae75dc4b75c4d42179a20fc659407248982"},{"args":{"address":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","slot":"0x1"},"name":"read_storage","resultSha256":"6aed34e6bddff5e1d872b5d7d5698a7b73abd6f3b33402732edc73ab9ffb9c70"},{"args":{"address":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","slot":"0x1"},"name":"read_storage","resultSha256":"6aed34e6bddff5e1d872b5d7d5698a7b73abd6f3b33402732edc73ab9ffb9c70"},{"args":{"address":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","slot":"0x5"},"name":"read_storage","resultSha256":"237f2dab356bba4af2833a18690d0ae75dc4b75c4d42179a20fc659407248982"},{"args":{"address":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","slot":"0x0"},"name":"read_storage","resultSha256":"aecf8208403a2da30dcb9110773448ec76c15bd9ba19d6c6f6bf20cf86fcfad7"}]},"scaeCheck":{"disagreement":false,"gradeIntact":"F","gradeStripped":"F"},"subject":{"address":"0xe82719202e5965Cf5D9B6673B7503a3b92DE20be","blockNumber":26105976,"chainId":1,"codeHash":"0x5d300a40efbe8176b85ea632a0d3da8988e0256d9c3a36e87e40cc8884a9862f","matchType":"match","name":"Rubixi","proxy":null,"role":"primary","sourceVerified":true}},"blockNumber":11830326,"txHash":"b6d36756404cd67b20a7f01181290021c900809e695febb5f341520d98e61149"},{"key":"0x33815e7d74c4a7d322d29b03cc4f33d966e7f4346b3ed7ba6b3b5a5d99803b3e","signer":"0x8De4Bb6Ff68DB026e94131e36688C50dF78246Be","record":{"chainId":1,"contractAddress":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","codeHash":"0x798c8681b76572d14dfa041d337a8e065029a47c1ff1fe358a23c7efe1ba5384","blockNumber":26105982,"dependenciesHash":"0x569e75fc77c1a856f6daaf9e69d8a9566ca34aa47f9133711ce065a571af0cfd","grade":"F","score":15,"configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","reportHash":"0x65a5c12f536f5d5f6a34f5d02b98701e4296dfc1fef6e96337755d1c4bc91667","issuedAt":1790960420},"report":{"audit":{"confidence":{"level":"high","reason":"Full verified source available; the critical lock was confirmed against live storage (bidIndex 3669, refundProgress 3669, totalBids 5495). No external dependencies required fetching."},"findings":[{"description":"`claimProjectFunds` requires `refundProgress >= totalBids`. `refundProgress` is an index into `allBids` and can at most reach `bidIndex` (number of distinct bidders + 1), while `totalBids` counts NFTs bid for (each bidder may place up to 3). Whenever bidders average more than one bid, the condition is unsatisfiable forever. On-chain state confirms this: bidIndex = refundProgress = 3669 while totalBids = 5495, so the owner's withdrawal reverts permanently and all project ETH (on the order of ~11.5k ETH) is irrecoverably frozen; emergencyWithdraw cannot help because every bidder already has finalProcess = 1.","location":"AkuAuction.claimProjectFunds","recommendation":"Compare `refundProgress >= bidIndex` (or track a separate 'all refunds processed' flag). The deployed instance cannot be fixed; funds are lost.","severity":"critical","title":"claimProjectFunds compares incomparable counters, permanently locking proceeds"},{"description":"The refund loop does `require(sent)` on a push-payment to each bidder in order. A single bidder that is a contract with a reverting fallback (or a bidder who places a bid from such a contract deliberately) stops `_refundProgress` from advancing past its index, blocking refunds for all later bidders and, transitively, `claimProjectFunds`. This was exploited in practice against this contract by a griefing contract during the refund phase.","location":"AkuAuction.processRefunds","recommendation":"Use a pull-payment pattern (record owed refund, let bidders claim), or on failure record the amount for later claim and continue instead of reverting.","severity":"high","title":"processRefunds can be bricked by any bidder whose receive reverts"},{"description":"After expiresAt + 3 days, any bidder with finalProcess == 0 can withdraw `price * bidsPlaced` (the full amount, not the clearing-price difference). If the NFT airdrop occurred but processRefunds did not reach that bidder (e.g. due to the DoS above), the bidder keeps the NFTs and gets a full refund, at the project's expense.","location":"AkuAuction.emergencyWithdraw","recommendation":"Gate emergencyWithdraw on airdrop not having occurred, or refund only the clearing-price difference once the airdrop has started.","severity":"medium","title":"emergencyWithdraw refunds full bid even if NFTs were already airdropped"},{"description":"`loadMintPassOwners` lets the owner set `mintPassOwner[addr]` to any value at any time, including after the auction and before refunds are processed. Each 'pass' adds 0.5 ETH to that bidder's refund (capped by bidsPlaced), so the owner can grant up to 1.5 ETH per colluding bidder from pooled funds. Mismatched `owners`/`amounts` lengths also revert without a check.","location":"AkuAuction.loadMintPassOwners","recommendation":"Freeze mint-pass loading before the auction starts, verify against the actual mint-pass token, and check array length equality.","severity":"medium","title":"Owner can direct 0.5 ETH per bid to arbitrary addresses via mint-pass list"},{"description":"`claimProjectFunds` requires `akuNFTs.airdropProgress() >= totalBids`; `akuNFTs` can be set to any address by the owner at any time, so this check offers no real guarantee to bidders, and if left unset the call reverts.","location":"AkuAuction.setNFTContract / claimProjectFunds","recommendation":"Set the NFT contract once (immutable or one-shot setter) and validate the interface.","severity":"low","title":"Owner-set NFT contract is an unchecked external dependency for withdrawal"},{"description":"`currentTime - startAt` reverts when called before the auction starts, making `getPrice` and `getAuctionDetails` unusable pre-start.","location":"AkuAuction.getPrice","recommendation":"Clamp `currentTime` to `startAt` when earlier.","severity":"low","title":"getPrice underflows before startAt"},{"description":"The `gasUsed < 5000000` loop bound does not account for the gas needed after the loop and the 63/64 rule; `maxNFTs` is stored but never used; `amount == 0` bids are accepted and create empty bid records.","location":"AkuAuction.processRefunds / _bid","recommendation":"Require `amount > 0`; remove unused state; use an explicit batch size parameter.","severity":"informational","title":"Gas-based loop bound is approximate and unused counters"}],"grade":"F","scope":{"analyzed":["0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d"],"skipped":[],"sourceVerified":{"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d":true}},"score":15,"summary":"AkuAuction is a Dutch auction for 5,495 NFT slots: bidders pay a time-decaying price (up to 3 bids each), receive the difference between their bid price and the final clearing price via a batched processRefunds loop (plus a 0.5 ETH mint-pass discount), and the owner then forwards remaining proceeds to the immutable `project` address via claimProjectFunds. Live state at the pinned block shows the auction filled (totalBids = 5495), all 3,668 bidders refunded (refundProgress = bidIndex = 3669), yet claimProjectFunds can never succeed because it compares refundProgress (a bidder count) against totalBids (an NFT count). The proceeds are therefore permanently locked in the contract.","upgradeability":{"notes":"Plain non-proxy contract with immutable project/price parameters. Owner retains control over the mint-pass list and NFT contract address but cannot change code.","timelock":false,"upgradeable":false}},"dependencies":[],"id":"eip155:1:0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","notFetched":[],"pipeline":{"auditorVersion":"0.1.0","configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","model":"claude-fable-5-1","requests":[{"model":"claude-fable-5-1","pass":"intact","requestSha256":"dce39c70d9a3d5f1c7c7dd11b7fa989fdf111bee66f76d760fb37aa2067ea008","responseSha256":"236d9e2d87b307925d714b48a3c925188331ad5861f38757ba8c2f7a18e5f59d","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":8478,"output":1700}},{"model":"claude-fable-5-1","pass":"intact","requestSha256":"fc96d5137abb4f727e4a6819244e91123070a66cbd36341d9cdbb059416c776d","responseSha256":"a23c38edb69ff432bd3317bd0ae9307b8f7320b76966f2383092532bbc176b41","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":10390,"output":2317}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"56430387d0ee501be3b40cee8fb914c31bb56516fb74747540d34f1542c8803a","responseSha256":"242f5e260591ec80be79bd10440c8be58f96f20795deccea6a2cdd7d173679db","status":200,"stopReason":"tool_use","turn":0,"usage":{"input":4797,"output":1353}},{"model":"claude-fable-5-1","pass":"stripped","requestSha256":"5d31096ad6518648cbc92eb16edf153d5388c1ad58353eaa5482d41e8a87fcbc","responseSha256":"c88ebc1df087dd7b05fee5be7c712f1518d07407725b2a012f41efa26dd733e1","status":200,"stopReason":"end_turn","turn":1,"usage":{"input":6358,"output":2303}}]},"provenance":{"rpc":{"blockHash":"0x3ea4fb02ff272dbd235a27f4afdf3fce1ac07a721708d545eb953e72da085df4","blockNumber":26105982,"url":"https://ethereum-rpc.publicnode.com"},"sources":{"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d":{"bodySha256":"bdb174665353500ed2d9f5893f678a069543e80f3805e54662279e9a1c67f227","matchType":"match","provider":"sourcify","url":"https://sourcify.dev/server/v2/contract/1/0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d?fields=all"}},"toolCalls":[{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0x7"},"name":"read_storage","resultSha256":"832650473dea2eafaec5ea1cce49bd98405faf84017fb8c41959159ac3eb8aaa"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0x8"},"name":"read_storage","resultSha256":"f53c575dc0bcc0522127101ab5a3e1c2cb28bac861388b43a0f6bd66aabf4a26"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0xb"},"name":"read_storage","resultSha256":"832650473dea2eafaec5ea1cce49bd98405faf84017fb8c41959159ac3eb8aaa"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0x9"},"name":"read_storage","resultSha256":"04e265be3d9e4c28e7ab563faf3d433ac264e62310c05b145656355baf39e015"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0x7"},"name":"read_storage","resultSha256":"832650473dea2eafaec5ea1cce49bd98405faf84017fb8c41959159ac3eb8aaa"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0x8"},"name":"read_storage","resultSha256":"f53c575dc0bcc0522127101ab5a3e1c2cb28bac861388b43a0f6bd66aabf4a26"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0xb"},"name":"read_storage","resultSha256":"832650473dea2eafaec5ea1cce49bd98405faf84017fb8c41959159ac3eb8aaa"},{"args":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","slot":"0x3"},"name":"read_storage","resultSha256":"61b8655e826772a948118ca6e52c307f7ad8c86cd7ff628b3068ba8466faf45f"}]},"scaeCheck":{"disagreement":false,"gradeIntact":"F","gradeStripped":"F"},"subject":{"address":"0xF42c318dbfBaab0EEE040279C6a2588Fa01a961d","blockNumber":26105982,"chainId":1,"codeHash":"0x798c8681b76572d14dfa041d337a8e065029a47c1ff1fe358a23c7efe1ba5384","matchType":"match","name":"AkuAuction","proxy":null,"role":"primary","sourceVerified":true}},"blockNumber":11830333,"txHash":"f7821543183773845c9c347b6b836510d960f387c2618d8ff8f9e2f4f1097534"},{"key":"0x9534005ed1a7d6b891f9794af8e30019728ce27a115dec50ab3978d04d17980f","signer":"0x8a4183136B4fa8d4845d3245DFF3a312C6d1be76","record":{"chainId":11155111,"contractAddress":"0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238","codeHash":"0xcd3f29e2ea9c61dadd48bfeaf8b2884b6de9dfee7bf45329452c4c33d0868ceb","blockNumber":11830422,"dependenciesHash":"0x4b8aa51b76e26f87d25d3895d5469dafcb86d3e5059f24c03e5780e63da5551e","grade":"B","score":80,"configHash":"0x47ada71a2b09d259414aac478aabd138fb0ceec2587c79dfb975db5c1e52e1a3","reportHash":"0xde34f9f355e0dbca9c25e45d40ed14656c032e3b2c187302dcb072cd2768e8be","issuedAt":1790961638},"report":{"audit":{"confidence":{"level":"high","reason":"Both proxy and implementation sources are verified and match upstream Circle stablecoin-evm code; live admin, implementation, owner, paused, symbol and initialization state were confirmed via storage reads and calls. Admin and owner addresses were confirmed to be EOAs."},"findings":[{"description":"The admin slot (0x10d6a5...390b) holds 0xD48f3032f64e3127883FDa62BC2C47C698d6Baf7, which has no code (EOA). upgradeTo/upgradeToAndCall are gated only by ifAdmin, so a compromised or malicious key can replace the implementation in a single transaction and arbitrarily alter balances or steal all tokens, with no delay for users to react.","location":"AdminUpgradeabilityProxy.upgradeTo / upgradeToAndCall","recommendation":"Transfer proxy admin to a multisig behind a timelock (or a ProxyAdmin owned by a timelock) so upgrades are announced before taking effect.","severity":"medium","title":"Proxy admin is a single EOA with no timelock; can swap implementation instantly"},{"description":"The token owner (0xaB7Dbf0Fc9d32349c484419073098DcD52C14798, no code) can unilaterally set masterMinter, pauser, blacklister and rescuer. Through those roles the operator can mint unlimited supply, freeze any account (blacklist), pause all transfers, and rescue any ERC20 held by the contract. Blacklisted balances are effectively confiscated (cannot be moved). This is by design for a regulated fiat stablecoin but constitutes full custodial trust in the operator.","location":"FiatTokenV1.updateMasterMinter / Pausable.updatePauser / Blacklistable.updateBlacklister / Rescuable.updateRescuer","recommendation":"Hold owner and privileged roles in multisigs with separation of duties; document the trust model for integrators.","severity":"medium","title":"Highly centralized token roles held by an EOA owner"},{"description":"The post-upgrade initializer call is made via address(this).call{value: msg.value}(data) and failures bubble as an empty revert, making failed migrations harder to diagnose. ETH sent to a non-payable initializer would revert, but any ETH accepted by a future payable implementation would be stuck since no withdrawal path exists.","location":"AdminUpgradeabilityProxy.upgradeToAndCall","recommendation":"Bubble up the revert data from the inner call and avoid sending value unless an initializer explicitly requires it.","severity":"low","title":"upgradeToAndCall forwards msg.value and relies on bare require(success) with no revert reason"},{"description":"SignatureChecker.isValidSignatureNow staticcalls the signer when it has code, so validity of permits/authorizations for contract wallets can change over time and is controlled by third-party wallet logic. The staticcall is bounded and result-checked, so impact is limited to the signer's own funds.","location":"SignatureChecker.isValidSignatureNow / isValidERC1271SignatureNow
