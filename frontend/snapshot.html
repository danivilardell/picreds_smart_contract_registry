const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (h, n = 6) => h ? h.slice(0, 2 + n) + "…" + h.slice(-4) : "—";
const chainName = (id) => (CHAINS[id] || [`chain ${id}`])[0];
const explorer = (id, path) => CHAINS[id] ? `${CHAINS[id][1]}/${path}` : null;
const when = (ts) => new Date(Number(ts) * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

// Canonical JSON exactly as the auditor computes it: sorted keys, no whitespace, UTF-8.
const canonical = (v) => Array.isArray(v) ? "[" + v.map(canonical).join(",") + "]"
  : v && typeof v === "object" ? "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canonical(v[k])).join(",") + "}"
  : JSON.stringify(v);
const keccakText = (s) => ethers.keccak256(ethers.toUtf8Bytes(s));
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64urlDecode = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - s.length % 4) % 4)), (c) => c.charCodeAt(0));
const jwtParts = (jwt) => { const [h, p] = jwt.split("."); const dec = (x) => JSON.parse(new TextDecoder().decode(b64urlDecode(x))); return { header: dec(h), payload: dec(p) }; };
async function verifyJwt(jwt, modulusHex) {
  const [h, p, s] = jwt.split(".");
  const key = await crypto.subtle.importKey("jwk", { kty: "RSA", n: b64url(ethers.getBytes(modulusHex)), e: "AQAB", alg: "RS256", ext: true },
    { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["verify"]);
  return crypto.subtle.verify("RSASSA-PKCS1-v1_5", key, b64urlDecode(s), new TextEncoder().encode(h + "." + p));
}

// ---------------------------------------------------------------- config
let cfg = loadCfg();
function loadCfg() { try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("picreds-ui") || "{}") }; } catch { return { ...DEFAULTS }; } }
function saveCfg() { try { localStorage.setItem("picreds-ui", JSON.stringify(cfg)); } catch {} }
function showCfg() { $("cfgRpc").value = cfg.rpc; $("cfgRegistry").value = cfg.registry; $("cfgFrom").value = cfg.from; $("cfgRpcs").value = JSON.stringify(cfg.rpcs); }
function readCfg() {
  let rpcs = cfg.rpcs; try { rpcs = JSON.parse($("cfgRpcs").value || "{}"); } catch { setStatus("RPC map is not valid JSON; keeping the previous map."); }
  cfg = { rpc: $("cfgRpc").value.trim(), registry: $("cfgRegistry").value.trim(), from: Number($("cfgFrom").value) || 0, rpcs }; saveCfg();
}

// ---------------------------------------------------------------- data: { registry, audits[], signers{}, codeHashes{}, mode }
let data = null, selectedKey = null, selectedIdx = 0, gradeFilter = new Set();

async function loadLive() {
  setStatus("Connecting…");
  const provider = new ethers.JsonRpcProvider(cfg.rpc);
  const reg = new ethers.Contract(cfg.registry, ABI, provider);
  const net = await provider.getNetwork();
  const latest = await provider.getBlockNumber();
  const [aud, own] = await Promise.all([reg.expectedAudience(), reg.owner()]);
  setStatus(`Scanning blocks ${cfg.from.toLocaleString()} to ${latest.toLocaleString()} for audits…`);
  const [auditLogs, signerLogs] = await Promise.all([chunkedLogs(reg, reg.filters.AuditSubmitted(), cfg.from, latest), chunkedLogs(reg, reg.filters.SignerRegistered(), cfg.from, latest)]);
  const signers = {};
  for (const l of signerLogs) {
    const addr = l.args.signer, jwt = l.args.jwt;
    const [info, kid] = [await reg.signers(addr), jwtParts(jwt).header.kid];
    const [approved, modulus] = await Promise.all([reg.approvedImages(info.imageDigest), reg.googleKeys(kid)]);
    signers[addr.toLowerCase()] = { address: addr, jwt, kid, imageDigest: info.imageDigest, attestationHash: info.attestationHash, registeredAt: Number(info.registeredAt), approved, modulus, txHash: l.transactionHash };
  }
  const audits = auditLogs.map((l) => ({ key: l.args.key, signer: l.args.signer, record: plainRecord(l.args.record), report: JSON.parse(l.args.report), blockNumber: l.blockNumber, txHash: l.transactionHash }));
  setStatus("Reading current code hashes…");
  const codeHashes = {};
  for (const a of audits) {
    const k = `${a.record.chainId}:${a.record.contractAddress.toLowerCase()}`;
    if (k in codeHashes) continue;
    const url = cfg.rpcs[String(a.record.chainId)] || (Number(net.chainId) === a.record.chainId ? cfg.rpc : null);
    try { codeHashes[k] = url ? ethers.keccak256(await new ethers.JsonRpcProvider(url).getCode(a.record.contractAddress)) : null; } catch { codeHashes[k] = null; }
  }
  return { mode: "live", takenAt: Date.now(), block: latest, registry: { address: cfg.registry, chainId: Number(net.chainId), owner: own, expectedAudience: aud }, audits, signers, codeHashes };
}
async function chunkedLogs(contract, filter, from, to, step = 20000) {
  const out = [];
  for (let a = from; a <= to; a += step) out.push(...await contract.queryFilter(filter, a, Math.min(a + step - 1, to)));
  return out;
}
const plainRecord = (r) => ({ chainId: Number(r.chainId), contractAddress: r.contractAddress, codeHash: r.codeHash, blockNumber: Number(r.blockNumber), dependenciesHash: r.dependenciesHash,
  grade: String.fromCharCode(parseInt(r.grade.slice(2, 4), 16)), score: Number(r.score), configHash: r.configHash, reportHash: r.reportHash, issuedAt: Number(r.issuedAt) });

async function load() {
  const snap = $("snapshot").textContent.trim();
  try {
    if (snap) { data = { ...JSON.parse(snap), mode: "snapshot" }; }
    else data = await loadLive();
  } catch (e) {
    if (snap) throw e;
    data = null; render();
    setStatus(`Could not read the registry: ${e.shortMessage || e.message}. Check the connection settings above.`);
    return;
  }
  setStatus("");
  render();
}

// ---------------------------------------------------------------- rendering
// Only audits signed by a key attested with a real Google-signed token are shown; MOCK_TEE development records are hidden.
const isRealTee = (a) => { const s = data.signers[a.signer.toLowerCase()]; return !!s && !s.kid.startsWith("mock"); };
function groups() {
  const m = new Map();
  for (const a of data.audits.filter(isRealTee)) { const k = `${a.record.chainId}:${a.record.contractAddress.toLowerCase()}`; if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
  for (const list of m.values()) list.sort((x, y) => y.record.issuedAt - x.record.issuedAt);
  return [...m.entries()].sort((x, y) => y[1][0].record.issuedAt - x[1][0].record.issuedAt);
}
const subjectName = (a) => a.report.subject?.name || a.report.audit?.summary?.match(/^([A-Z][A-Za-z0-9_]{2,40})\b/)?.[1] || null;

function render() {
  const list = $("list"), q = $("search").value.trim().toLowerCase();
  list.innerHTML = "";
  if (!data) { list.innerHTML = `<div class="empty">No data loaded.</div>`; return; }
  const gs = groups().filter(([, v]) => {
    const a = v[0], name = (subjectName(a) || "").toLowerCase();
    return (!q || a.record.contractAddress.toLowerCase().includes(q) || name.includes(q)) && (!gradeFilter.size || gradeFilter.has(a.record.grade));
  });
  if (!gs.length) list.innerHTML = `<div class="empty">${data.audits.filter(isRealTee).length ? "No audits match the filter." : "No TEE-attested audits have been submitted to this registry yet."}</div>`;
  for (const [k, versions] of gs) {
    const a = versions[0], r = a.record;
    const el = document.createElement("button"); el.type = "button"; el.className = "card"; el.setAttribute("aria-current", String(k === selectedKey));
    el.innerHTML = `
      <div class="grade g-${r.grade}">${r.grade}<small>${r.score}</small></div>
      <div style="min-width:0">
        <div class="name">${esc(subjectName(a) || "Unnamed contract")} <span class="muted" style="font-weight:400;font-size:12.5px">${esc(chainName(r.chainId))}</span></div>
        <div class="addr mono">${esc(r.contractAddress)}</div>
      </div>`;
    el.onclick = () => { selectedKey = k; selectedIdx = 0; history.replaceState(null, "", "#" + k.replace(":", "-")); render(); };
    list.appendChild(el);
  }
  renderDetail();
}

async function renderDetail() {
  const d = $("detail");
  const versions = selectedKey && data ? groups().find(([k]) => k === selectedKey)?.[1] : null;
  if (!versions) { d.innerHTML = `<div class="empty">Select an audited contract to see its verification checklist and report.</div>`; return; }
  const a = versions[Math.min(selectedIdx, versions.length - 1)], r = a.record, cs = a.report, audit = cs.audit, signer = data.signers[a.signer.toLowerCase()];
  const subjLink = explorer(r.chainId, `address/${r.contractAddress}`), txLink = explorer(data.registry.chainId, `tx/${a.txHash}`);
  const findings = [...audit.findings].sort((x, y) => SEV_ORDER.indexOf(x.severity) - SEV_ORDER.indexOf(y.severity));
  const deps = cs.dependencies || [];
  d.innerHTML = `
    <div class="panel">
      <div class="dhead">
        <div class="grade g-${r.grade}">${r.grade}<small>${r.score} / 100</small></div>
        <div class="grow">
          <h2>${esc(subjectName(a) || "Unnamed contract")}</h2>
          <div class="hash">${subjLink ? `<a href="${subjLink}" target="_blank" rel="noopener">${esc(r.contractAddress)}</a>` : esc(r.contractAddress)}</div>
          <div class="meta" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
            <span class="pill">${esc(chainName(r.chainId))}</span>
            <span class="pill">block ${r.blockNumber.toLocaleString()}</span>
            <span class="pill ${audit.confidence.level === "high" ? "good" : audit.confidence.level === "medium" ? "warn" : "bad"}">confidence ${esc(audit.confidence.level)}</span>
            ${audit.upgradeability?.upgradeable ? `<span class="pill ${audit.upgradeability.timelock ? "" : "warn"}">upgradeable${audit.upgradeability.timelock ? ", timelocked" : ", no timelock"}</span>` : `<span class="pill good">not upgradeable</span>`}
            ${cs.subject?.sourceVerified === false ? `<span class="pill bad">source unverified</span>` : ""}
            <span class="pill good">TEE attested</span>
          </div>
        </div>
      </div>
      ${versions.length > 1 ? `<div style="margin-top:12px"><h3>Records for this address</h3><div class="versions">${versions.map((v, i) => `<button type="button" class="vbtn" data-i="${i}" aria-pressed="${i === selectedIdx}">${when(v.record.issuedAt)} · ${v.record.grade} ${v.record.score} · code ${short(v.record.codeHash, 4)} · signer ${short(v.signer, 4)}</button>`).join("")}</div></div>` : ""}
    </div>

    <div class="panel"><h3>Summary</h3><p class="summary">${esc(audit.summary)}</p>
      <dl class="kv" style="margin-top:10px"><dt>Confidence</dt><dd>${esc(audit.confidence.level)}: ${esc(audit.confidence.reason)}</dd>
      <dt>Upgradeability</dt><dd>${esc(audit.upgradeability?.notes || "—")}</dd>
      <dt>SCAE check</dt><dd>grade ${esc(cs.scaeCheck?.gradeIntact)} with source intact, ${esc(cs.scaeCheck?.gradeStripped)} with comments and strings stripped${cs.scaeCheck?.disagreement ? " <b>(disagreement, worse grade reported)</b>" : " (agree)"}</dd></dl>
    </div>

    <div class="panel"><h3>Verification</h3><div class="checks" id="checks"></div></div>

    <div class="panel"><h3>Findings (${findings.length})</h3>
      ${findings.length ? `<div class="scroll"><table><thead><tr><th>Severity</th><th>Finding</th><th>Location</th></tr></thead><tbody>
      ${findings.map((f) => `<tr><td><span class="sev sev-${esc(f.severity)}">${esc(f.severity)}</span></td><td><b>${esc(f.title)}</b><div class="muted" style="margin-top:3px">${esc(f.description)}</div><div style="margin-top:4px"><span class="muted">Fix:</span> ${esc(f.recommendation)}</div></td><td class="mono" style="white-space:normal;overflow-wrap:anywhere">${esc(f.location)}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted" style="margin:0">No findings.</p>`}
    </div>

    <div class="panel"><h3>Scope</h3>
      <div class="scroll"><table><thead><tr><th>Contract</th><th>Role</th><th>Source</th><th>Code hash</th></tr></thead><tbody>
        <tr><td class="mono">${esc(r.contractAddress)}</td><td>primary${cs.subject?.name ? ` · ${esc(cs.subject.name)}` : ""}</td><td>${esc(cs.subject?.matchType || (cs.scope?.sourceVerified?.[r.contractAddress] ? "verified" : "—"))}</td><td class="hash">${esc(r.codeHash)}</td></tr>
        ${deps.map((x) => `<tr><td class="mono">${esc(x.address)}</td><td>${esc(x.role)}${x.name ? ` · ${esc(x.name)}` : ""}</td><td>${esc(x.matchType)}</td><td class="hash">${esc(x.codeHash)}</td></tr>`).join("")}
      </tbody></table></div>
      ${cs.notFetched?.length ? `<p class="muted" style="margin:10px 0 0;font-size:13px">Not fetched: ${cs.notFetched.map((n) => `<span class="mono">${esc(short(n.address, 8))}</span> (${esc(n.reason)})`).join(", ")}</p>` : ""}
    </div>

    <div class="panel"><h3>Pipeline and provenance</h3>
      <dl class="kv">
        <dt>Model</dt><dd class="mono">${esc(cs.pipeline?.model)} · auditor ${esc(cs.pipeline?.auditorVersion)}</dd>
        <dt>configHash</dt><dd class="hash">${esc(r.configHash)}</dd>
        <dt>reportHash</dt><dd class="hash">${esc(r.reportHash)}</dd>
        <dt>Signer</dt><dd class="hash">${esc(a.signer)}${signer ? ` · image sha256:${esc(signer.imageDigest.slice(2))}` : ""}</dd>
        <dt>Submitted</dt><dd>${txLink ? `<a href="${txLink}" target="_blank" rel="noopener">tx ${esc(short(a.txHash, 8))}</a>` : esc(short(a.txHash, 8))} in block ${a.blockNumber.toLocaleString()}</dd>
        <dt>RPC</dt><dd class="hash">${esc(cs.provenance?.rpc?.url)} · block hash ${esc(short(cs.provenance?.rpc?.blockHash, 8))}</dd>
      </dl>
      <details class="more" style="margin-top:10px"><summary>${(cs.pipeline?.requests || []).length} model calls, ${(cs.provenance?.toolCalls || []).length} tool calls, ${Object.keys(cs.provenance?.sources || {}).length} source fetches</summary>
        <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Pass</th><th>Turn</th><th>Stop</th><th>Tokens in / out</th><th>Request sha256</th><th>Response sha256</th></tr></thead><tbody>
        ${(cs.pipeline?.requests || []).map((t) => `<tr><td>${esc(t.pass)}</td><td class="n">${t.turn}</td><td>${esc(t.stopReason)}</td><td class="n">${t.usage?.input?.toLocaleString()} / ${t.usage?.output?.toLocaleString()}</td><td class="hash">${esc(short(t.requestSha256, 10))}</td><td class="hash">${esc(short(t.responseSha256, 10))}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Tool</th><th>Arguments</th></tr></thead><tbody>
        ${(cs.provenance?.toolCalls || []).map((t) => `<tr><td class="mono">${esc(t.name)}</td><td class="hash">${esc(JSON.stringify(t.args))}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Source</th><th>Provider</th><th>Match</th><th>Body sha256</th></tr></thead><tbody>
        ${Object.entries(cs.provenance?.sources || {}).map(([addr, s]) => `<tr><td class="mono">${esc(short(addr, 8))}</td><td>${esc(s.provider)}</td><td>${esc(s.matchType)}</td><td class="hash">${esc(short(s.bodySha256, 10))}</td></tr>`).join("")}
        </tbody></table></div>
      </details>
    </div>`;
  d.querySelectorAll(".vbtn").forEach((b) => b.onclick = () => { selectedIdx = Number(b.dataset.i); renderDetail(); });
  await renderChecks(a, signer);
}

async function renderChecks(a, signer) {
  const r = a.record, cs = a.report, el = $("checks"), out = [];
  const add = (state, text, why) => out.push({ state, text, why });
  const k = `${r.chainId}:${r.contractAddress.toLowerCase()}`, now = data.codeHashes[k];
  if (now === null || now === undefined) add("warn", "Current code not checked", "No RPC configured for this chain.");
  else if (now === r.codeHash) add("ok", "Code unchanged since the audit", `EXTCODEHASH at ${data.mode === "live" ? "the latest block" : "the snapshot block"} equals the audited codeHash.`);
  else add("fail", "Code changed since the audit", `Current EXTCODEHASH ${short(now, 8)} differs from audited ${short(r.codeHash, 8)}. The contract was upgraded or replaced.`);

  const rh = keccakText(canonical(cs));
  if (rh === r.reportHash) add("ok", "Report matches reportHash", "keccak256 of the canonical report JSON from the event equals the on-chain record.");
  else add("fail", "Report does not match reportHash", `Recomputed ${short(rh, 8)}; on chain ${short(r.reportHash, 8)}.`);

  try {
    const deps = (cs.dependencies || []).map((x) => [x.chainId, x.address, x.codeHash, x.blockNumber]);
    const dh = ethers.keccak256(ethers.AbiCoder.defaultAbiCoder().encode(["tuple(uint256,address,bytes32,uint256)[]"], [deps]));
    add(dh === r.dependenciesHash ? "ok" : "fail", dh === r.dependenciesHash ? `Dependencies match dependenciesHash (${deps.length})` : "Dependencies do not match dependenciesHash", `keccak256(abi.encode(Subject[])) over the report's dependency tuples.`);
  } catch (e) { add("warn", "Dependencies hash not checked", e.message); }

  if (!signer) add("fail", "Signer is not attested", `${a.signer} has no registration in this registry.`);
  else {
    add("ok", "Signer attested", `Registered ${when(signer.registeredAt)} for image sha256:${signer.imageDigest.slice(2)}.`);
    add(signer.approved ? "ok" : "fail", signer.approved ? "Image digest is approved" : "Image digest is no longer approved", `approvedImages(${short(signer.imageDigest, 8)})`);
    let claims = null; try { claims = jwtParts(signer.jwt); } catch {}
    if (!claims) add("fail", "Attestation token unreadable", "");
    else {
      const p = claims.payload, nonce = Array.isArray(p.eat_nonce) ? p.eat_nonce[0] : p.eat_nonce;
      if (signer.modulus && signer.modulus !== "0x") {
        let valid = false; try { valid = await verifyJwt(signer.jwt, signer.modulus); } catch {}
        add(valid ? "ok" : "fail", valid ? "Attestation signature verifies (RS256)" : "Attestation signature INVALID", `kid ${claims.header.kid}${signer.kid.startsWith("mock") ? " (mock dev key, not Google)" : " (Google Confidential Space key)"}, checked in this browser with WebCrypto against the on-chain modulus.`);
      } else add("warn", "Attestation key rotated out", `kid ${claims.header.kid} is no longer in googleKeys; the registration was verified on chain while the key was live.`);
      add(p.aud === data.registry.expectedAudience ? "ok" : "fail", "Audience bound to this registry", `aud = ${p.aud}`);
      add(nonce?.toLowerCase() === a.signer.toLowerCase() ? "ok" : "fail", "Nonce is the signer address", `eat_nonce = ${nonce}`);
      add(p.dbgstat === "disabled-since-boot" ? "ok" : "fail", "Production image (debug disabled)", `dbgstat = ${p.dbgstat}, hwmodel = ${p.hwmodel}, swname = ${p.swname}, exp ${when(p.exp)}`);
    }
  }
  el.innerHTML = out.map((c) => `<div class="check"><span class="ic ${c.state}">${{ ok: "✓", fail: "✗", warn: "!", pend: "…" }[c.state]}</span><div><div>${esc(c.text)}</div>${c.why ? `<div class="why">${esc(c.why)}</div>` : ""}</div></div>`).join("");
}

function setStatus(t) { $("status").textContent = t; }

// ---------------------------------------------------------------- wiring
showCfg();
$("registryLink").textContent = cfg.registry;
$("registryLink").href = `https://sepolia.etherscan.io/address/${cfg.registry}`;
$("reload").onclick = () => { readCfg(); $("registryLink").textContent = cfg.registry; $("snapshot").textContent = ""; load(); };
$("resetCfg").onclick = () => { cfg = { ...DEFAULTS }; saveCfg(); showCfg(); };
$("search").oninput = () => render();
document.querySelectorAll(".gbtn").forEach((b) => b.onclick = () => { const g = b.dataset.g; gradeFilter.has(g) ? gradeFilter.delete(g) : gradeFilter.add(g); b.setAttribute("aria-pressed", String(gradeFilter.has(g))); render(); });
const anchor = location.hash.slice(1); if (/^\d+-0x[0-9a-fA-F]{40}$/.test(anchor)) selectedKey = anchor.replace("-", ":").toLowerCase();
load().then(() => { if (data) { $("chainName").textContent = chainName(data.registry.chainId); const ex = explorer(data.registry.chainId, `address/${cfg.registry}`); if (ex) $("registryLink").href = ex; if (!selectedKey && groups().length) { selectedKey = groups()[0][0]; render(); } } });
})();
</script>
